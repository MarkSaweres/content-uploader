name: Auto content pipeline

on:
  schedule:
    # Fires at 00:00 UTC = 5:00pm Pacific Daylight Time; the "Random delay"
    # step below adds 0-55 random minutes so the actual post time wanders
    # within the 5-6pm PT window instead of hitting the same minute daily.
    # NOTE: pinned to PDT (UTC-7). During Pacific Standard Time (roughly
    # early Nov - early Mar) this fires ~4-5pm PT instead of 5-6pm -- ask
    # to bump the hour to "0 1 * * *" when clocks fall back, and back to
    # "0 0 * * *" when they spring forward again.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video but skip the YouTube upload"
        type: boolean
        default: false
      theme:
        description: "Force a specific theme id from config.yaml (blank = random)"
        type: string
        default: ""

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Random delay to vary post time within the hour
        # Only on the real scheduled trigger -- manual test runs via
        # workflow_dispatch should start immediately, not wait up to ~55min.
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 3300 ))

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" | base64 -d > youtube_client_secret.json
          echo "$YOUTUBE_TOKEN_JSON" | base64 -d > youtube_token.json

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_SECRET_FILE: youtube_client_secret.json
          YOUTUBE_TOKEN_FILE: youtube_token.json
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.theme }}" ]; then ARGS="$ARGS --theme ${{ inputs.theme }}"; fi
          python main.py $ARGS

      - name: Upload generated video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/*.mp4
          retention-days: 14
